name: Security and Build Validation

on:
  push:
    branches:
      - hardening/security-seo-2026-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Resolve patched dependency versions and refresh lockfile
        if: github.event_name == 'push'
        run: pnpm install --no-frozen-lockfile

      - name: Install locked dependencies for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Verify minimum patched TanStack versions
        run: pnpm run security:check

      - name: Build production output and generate route tree
        run: pnpm run build

      - name: Type-check generated route tree
        run: pnpm run typecheck

      - name: Export regenerated lockfile for the branch
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

  commit-lockfile:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/hardening/security-seo-2026-10' && !startsWith(github.event.head_commit.message, 'chore: refresh pnpm lockfile') }}
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: hardening/security-seo-2026-10

      - name: Download validated lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: regenerated-pnpm-lockfile
          path: lockfile-artifact

      - name: Commit only the generated dependency lockfile
        run: |
          cp lockfile-artifact/pnpm-lock.yaml pnpm-lock.yaml
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile for TanStack security patch"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
