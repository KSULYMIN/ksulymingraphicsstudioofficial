name: Security and Build Validation

on:
  push:
    branches:
      - hardening/security-seo-2026-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Resolve patched dependency versions and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify minimum patched TanStack versions
        run: pnpm run security:check

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Export lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
